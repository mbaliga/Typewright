<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">
<title>Home, glyphs</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
@font-face { font-family: "Hyle Deco"; src: url(/_blob/87ef2c1f7693e8b7acd70e03d6088e45) format("truetype"); }
body { margin: 0; background: #EFE9DC; }
.m { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; }
.hy { font-family: "Hyle Deco", serif; }
.chip { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 9.5px; letter-spacing: 0.12em; text-transform: uppercase; padding: 5px 8px; border: 0; background: transparent; color: #17150F; }
.on { background: #17150F; color: #EFE9DC; }
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #EFE9DC; color: #17150F; font-family: 'IBM Plex Sans', system-ui, sans-serif">
<svg width="390" height="844" style="position: absolute; left: 0; top: 0; opacity: 0.55; mix-blend-mode: multiply; pointer-events: none" aria-hidden="true"><filter id="gr"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"></feTurbulence><feColorMatrix values="0 0 0 0 0.35 0 0 0 0 0.3 0 0 0 0 0.22 0 0 0 0.26 0"></feColorMatrix></filter><rect width="390" height="844" filter="url(#gr)"></rect></svg>

<div style="position: absolute; left: 22px; top: 56px; right: 22px; display: flex; flex-direction: column; gap: 3px">
<div style="font-size: 15px; font-weight: 600">Hyle Deco · glyphs</div>
<div class="m" style="color: #6F6A5E; font-size: 9.5px">Latin · against 30 geometric sans</div>
</div>

<div style="position: absolute; left: 16px; top: 108px; right: 16px; display: flex; gap: 4px; flex-wrap: wrap">
<button class="chip on">All 338</button>
<button class="chip">● 38</button>
<button class="chip">◐ 7</button>
<button class="chip">✓ 7</button>
<button class="chip">Locked 0</button>
</div>

<div style="position: absolute; left: 14px; top: 150px; width: 362px; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); row-gap: 14px; column-gap: 2px; -webkit-mask-image: linear-gradient(to bottom, #000 78%, transparent 100%); mask-image: linear-gradient(to bottom, #000 78%, transparent 100%); height: 500px; overflow: hidden">
<sc-for list="{{cells}}" as="c" hint-placeholder-count="36">
<a href="Draw.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #17150F; text-decoration: none">
<span class="hy" style="font-size: 28px; line-height: 1.1">{{c.g}}</span>
<span class="m" style="font-size: 9px; letter-spacing: 0.04em; padding: 1px 4px; background: {{c.bg}}; color: {{c.fg}}; opacity: {{c.op}}">{{c.label}}</span>
</a>
</sc-for>
</div>

<div style="position: absolute; left: 22px; right: 22px; top: 636px; font-size: 12px; color: #6F6A5E" class="m">Tap a glyph to draw it · long-press for its box</div>

<div style="position: absolute; left: 0; top: 672px; width: 390px; height: 172px">
<dc-import name="Deck" section="Home" left="back" right="menu" toggles="Specimen|Glyphs*" hint-size="390px,172px"></dc-import>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    // Real counts from fonts/HyleDeco-Regular.ttf (composites decomposed), verdicts against
    // data/node-economy-latin.json sans-geometric with the brief's section 8.2 fence.
    const raw = 'A517o B101o C68o D60o E1092o F911o G69o H1252o I508o J44o K37o L746o M35a N43o O83o P49o Q96o R124o S129o T1763o U72o V19a W131o X23a Y986o Z1086o a183o b73o c98o d74o e224o f33o g87o h44o i8r j21r k12r l4r';
    const cells = raw.split(' ').map((t) => {
      const g = t[0];
      const kind = t[t.length - 1];
      const n = parseInt(t.slice(1, -1), 10);
      const num = n.toLocaleString('en-US');
      if (kind === 'o') return { g: g, label: num + ' ●', bg: '#17150F', fg: '#EFE9DC', op: 1 };
      if (kind === 'a') return { g: g, label: num + ' ◐', bg: 'transparent', fg: '#17150F', op: 1 };
      return { g: g, label: num + ' ✓', bg: 'transparent', fg: '#17150F', op: 0.6 };
    });
    return { cells: cells };
  }
}
</script>
</body>
</html>
