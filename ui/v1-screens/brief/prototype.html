<title>Typewright Brief</title>
<!-- SPDX-License-Identifier: FSL-1.1-ALv2 -->
<!--
  The Brief's design prototype (S25–S27). build.py fills the placeholders: IBM Plex, the cue faces,
  the style atlas, the example letters, and the real engine compiled to JavaScript. This file is the
  look and the interaction; every word and number on the page comes from the engine.

  The look is the owner's V1 screens canvas (ui/v1-screens/, CLAUDE.md law 6): IBM Plex Sans and
  Mono on the grained ground #EFE9DC, a 390-wide phone column with the title at left 22 / top 56 and
  the content from about 118, mono labels, the canvas `chip`, underline inputs, violet action
  links, and the canvas `Deck` (ui/v1-screens/Deck.dc.html) ported with its exact geometry. The
  canvas has no board for the Brief's own screens, so what they hold is this prototype's, dressed in
  the canvas's tokens (docs/OPEN_QUESTIONS.md).
-->
<style>
/*@PLEX_FONTS@*/
/*@CUE_FONTS@*/

/* One phone column on paper; space is made by type and whitespace, selection is an ink block, and
   only the deck at the foot is round (SCREENS_V1 §2, C2). */
:root {
  --canvas: #EFE9DC;
  --ink: #17150F;
  --fg: #1B1915;
  --muted: #6F6A5E;
  --line: rgba(23, 21, 15, .22);
  --field: rgba(23, 21, 15, .35);
  --accent: #5F4BE0;
  --red: #D0342C;
  --paper0: rgba(239, 233, 220, 0);
  --on-ink: #EFE9DC;
  --on-ink-muted: rgba(239, 233, 220, .72);
  --sans: 'IBM Plex Sans', system-ui, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, monospace;
  color-scheme: light;
}
/* The canvas's black ground (Deck theme "black"; the app's BLACK texture and its violet on black). */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --canvas: #000000; --ink: #F3F3F0; --fg: #ECECEA; --muted: #8E8E89;
    --line: rgba(255, 255, 255, .24); --field: rgba(243, 243, 240, .35); --accent: #8E7BFF; --red: #FF5A4E;
    --paper0: rgba(0, 0, 0, 0); --on-ink: #000000; --on-ink-muted: rgba(0, 0, 0, .66); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --canvas: #000000; --ink: #F3F3F0; --fg: #ECECEA; --muted: #8E8E89;
  --line: rgba(255, 255, 255, .24); --field: rgba(243, 243, 240, .35); --accent: #8E7BFF; --red: #FF5A4E;
  --paper0: rgba(0, 0, 0, 0); --on-ink: #000000; --on-ink-muted: rgba(0, 0, 0, .66); color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--canvas); }
body { margin: 0; color: var(--ink); font: 13px/1.45 var(--sans); -webkit-tap-highlight-color: transparent; }

/* The grain (paper only; the black ground has none). Under the text, over the ground. */
.grain { position: fixed; inset: 0; width: 100%; height: 100%; opacity: .55; mix-blend-mode: multiply; pointer-events: none; z-index: 0; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .grain { display: none; } }
:root[data-theme="dark"] .grain { display: none; }

/* The page frame: 390 wide, title at left 22 / top 56, content from about 118, room for the deck. */
.app { position: relative; z-index: 1; width: 390px; max-width: 100%; margin: 0 auto; padding: 56px 22px 214px; }
header { display: flex; flex-direction: column; gap: 3px; margin-bottom: 26px; }
header h1 { font-size: 15px; font-weight: 600; margin: 0; }
.m, header p, .label, .btn, .note-mono {
  font-family: var(--mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; font-variant-numeric: tabular-nums;
}
header p { margin: 0; color: var(--muted); font-size: 9.5px; }

.label { color: var(--muted); font-size: 9.5px; margin: 26px 0 8px; }
.label:first-child { margin-top: 0; }
.prompt { font-size: 17px; line-height: 1.3; font-weight: 600; margin: 6px 0 4px; text-wrap: balance; }
.why { color: var(--muted); font-size: 12.5px; line-height: 1.45; margin: 0 0 16px; max-width: 330px; }
.small { color: var(--muted); font-size: 12.5px; line-height: 1.45; margin: 8px 0; max-width: 330px; }
.note-mono { color: var(--muted); font-size: 9.5px; margin: 8px 0; }
p { margin: 0 0 10px; }

/* Choices with a specimen: rows of type. The chosen one is an ink block with paper text. */
.choices { display: grid; gap: 2px; margin: 0 -10px; }
.choice {
  display: grid; grid-template-columns: 76px minmax(0, 1fr); align-items: center; column-gap: 14px;
  width: 100%; text-align: left; font: inherit; color: inherit; background: none; border: 0;
  padding: 10px; cursor: pointer;
}
.choice.plain { grid-template-columns: minmax(0, 1fr); }
.choice .sp { font-size: 38px; line-height: 1; white-space: nowrap; overflow: hidden; }
.choice .t { font-weight: 600; font-size: 15px; }
.choice .d { color: var(--muted); font-size: 12.5px; margin-top: 1px; }
.choice .x { font-family: var(--mono); font-size: 9px; letter-spacing: .08em; color: var(--muted); margin-top: 4px; text-transform: uppercase; }
.choice[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); }
.choice[aria-pressed="true"] .d, .choice[aria-pressed="true"] .x { color: var(--on-ink-muted); }

/* The canvas `chip`: short mono answers (uses, feelings, yes/no). On = ink block, paper text. */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; padding: 6px 9px; border: 0; background: transparent; color: var(--ink); cursor: pointer; }
.chip.on, .chip[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); }
.choice:focus-visible, .btn:focus-visible, .chip:focus-visible, .dk:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

/* Buttons: square, flat, mono. Primary is an ink block, secondary an ink outline; the tertiary
   action is the canvas's violet link. */
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 14px 0 0; }
.btn { padding: 11px 14px; border: 1px solid var(--ink); background: none; color: var(--ink); cursor: pointer; }
.btn.primary { background: var(--ink); color: var(--on-ink); }
.btn.quiet { border: 0; padding: 4px 2px; font-family: var(--sans); font-size: 12.5px; font-weight: 600; letter-spacing: 0; text-transform: none; color: var(--accent); }

/* Text fields: an underline, not a box. */
.field { width: 100%; font: 14px/1.3 var(--sans); color: var(--ink); background: none; border: 0; border-bottom: 1px solid var(--field); padding: 4px 0; border-radius: 0; }
.field::placeholder { color: var(--muted); }
.field:focus { outline: none; border-bottom-color: var(--ink); }

/* The brief's own words, in the genre's face. */
.sentence { font-size: 22px; line-height: 1.25; margin: 6px 0 10px; text-wrap: balance; }
.glyphs { font-size: 38px; line-height: 1.15; letter-spacing: .14em; margin: 6px 0 8px; word-break: break-word; }
.glyphs.big { font-size: 64px; letter-spacing: .1em; }

/* A tension: a rule on the left, so it reads as one thing to decide. */
.tension { border-left: 2px solid var(--ink); padding: 2px 0 2px 14px; margin: 18px 0; }
.tension .t { font-weight: 600; font-size: 13px; }
.tension .b { margin: 4px 0; font-size: 12.5px; }
.src { font-family: var(--mono); font-size: 9px; letter-spacing: .06em; color: var(--muted); }

/* Targets: feature, then what the brief asks and where it came from. */
.targets { display: grid; gap: 14px; }
.target { display: grid; grid-template-columns: 8.5em minmax(0, 1fr); column-gap: 12px; font-size: 12.5px; }
.target .f { font-weight: 600; }
.target .v { font-variant-numeric: tabular-nums; }
.target .o { color: var(--muted); font-size: 12px; }

.item { margin: 16px 0 22px; }
.item .t { font-weight: 600; font-size: 14px; }
.item p { font-size: 12.5px; }
.face { display: grid; grid-template-columns: 76px minmax(0, 1fr); column-gap: 14px; align-items: center; margin: 12px 0; }
.face .sp { font-size: 34px; line-height: 1; }
.face .t { font-weight: 600; font-size: 15px; }
.face .d { color: var(--muted); font-size: 12.5px; }

/* The control deck: the canvas `Deck` component (ui/v1-screens/Deck.dc.html), 390 x 172 at the foot.
   Its paper fades up over the page, and the grain dissolves there (C4); the fade spans the viewport so a
   wider window shows no strip. Only the circles and the arcs are round (C2). */
.bloom { position: fixed; left: 0; right: 0; bottom: 0; height: 172px; z-index: 2; pointer-events: none;
  background: linear-gradient(to bottom, var(--paper0) 0%, var(--canvas) 40%); }
.deck { position: fixed; left: 50%; bottom: 0; width: 390px; height: 172px; margin-left: -195px; z-index: 3; pointer-events: none;
  font-family: var(--mono); transform-origin: 50% 100%; }
.deck svg { position: absolute; left: 0; top: 0; width: 390px; height: 172px; overflow: visible; }
.dk { position: absolute; padding: 0; border: 0; background: transparent; cursor: pointer; pointer-events: auto; }

/* The ⋯ menu rises from its circle; a toast says what only the app does. */
.menu { position: fixed; right: max(14px, calc(50vw - 181px)); bottom: 136px; display: grid; gap: 2px; z-index: 5; min-width: 230px; }
.menu button { text-align: left; font: 13px/1.3 var(--sans); padding: 11px 13px; border: 0; background: var(--ink); color: var(--on-ink); cursor: pointer; }
.menu button .k { display: block; font-family: var(--mono); font-size: 9px; letter-spacing: .12em; text-transform: uppercase; color: var(--on-ink-muted); margin-top: 2px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: 184px; max-width: min(92vw, 360px);
  background: var(--ink); color: var(--on-ink); padding: 10px 13px; font-size: 12.5px; z-index: 6; }
@media (prefers-reduced-motion: no-preference) {
  .app.fresh > * { animation: rise .24s ease-out both; }
  @keyframes rise { from { opacity: .35; transform: translateY(5px); } to { opacity: 1; transform: none; } }
}
</style>

<svg class="grain" aria-hidden="true"><filter id="gr" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"></feTurbulence><feColorMatrix values="0 0 0 0 0.35 0 0 0 0 0.3 0 0 0 0 0.22 0 0 0 0.26 0"></feColorMatrix></filter><rect width="100%" height="100%" filter="url(#gr)"></rect></svg>
<div class="app" id="app"><header><h1>Brief</h1><p>Loading 613 measured faces</p></header></div>
<div class="bloom"></div>
<nav class="deck" id="deck" aria-label="Sections and page toggles"></nav>
<div class="menu" id="menu" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>

<!--@ATLAS@-->
<!--@EXAMPLE_FONT@-->
<!--@ENGINE@-->
<script>
(() => {
  const engine = window.briefPrototype.com.asoc.typewright.brief.prototype;
  const app = document.getElementById("app");
  const deck = document.getElementById("deck");
  const menu = document.getElementById("menu");
  const toast = document.getElementById("toast");
  // The canvas's sections. There is no Brief section: the Brief is reached from S02 step 2 and from
  // Workbook Task 1, so on its pages the deck stays on Home, dimmed.
  const SECTIONS = ["Home", "Capture", "Trace", "Draw", "Space", "Check", "Ship", "Learn", "Workbook"];
  let view = null;
  let confirming = false;

  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const a = (o) => esc(JSON.stringify(o));
  const face = (key) => key ? `font-family:'cue-${key}',var(--sans)` : "";
  const genreFace = () => face(view.genreFace);

  function say(text) {
    toast.textContent = text;
    toast.hidden = false;
    clearTimeout(say.t);
    say.t = setTimeout(() => (toast.hidden = true), 2600);
  }

  // ---- pieces --------------------------------------------------------------------------------
  const btn = (label, action, kind = "") => `<button class="btn ${kind}" data-a="${a(action)}">${esc(label)}${kind === "quiet" ? " ›" : ""}</button>`;
  // The canvas `chip`: a short mono answer. The chosen ones are ink blocks.
  const chip = (o, action) => `<button class="chip${o.chosen ? " on" : ""}" aria-pressed="${!!o.chosen}" data-a="${a(action)}">${esc(o.title)}</button>`;
  const chips = (opts, actionOf) => `<div class="chips">${opts.map((o) => chip(o, actionOf(o))).join("")}</div>` +
    opts.filter((o) => o.chosen && o.detail).map((o) => `<p class="small"><b>${esc(o.title)}</b> · ${esc(o.detail)}</p>`).join("");
  const specimen = (c) => {
    if (!c) return "";
    const size = c.text.length <= 2 ? 38 : c.text.length <= 4 ? 26 : 19;
    return `<span class="sp" style="${face(c.face)};font-size:${size}px${c.tabular ? ";font-variant-numeric:tabular-nums" : ""}">${esc(c.text)}</span>`;
  };
  // keepColumn: hold the specimen column even when a face has no specimen, so names line up in a mixed list.
  const choice = (o, action, keepColumn = false) => {
    const sp = o.cue ? specimen(o.cue) : keepColumn ? `<span class="sp"></span>` : "";
    return `<button class="choice ${sp ? "" : "plain"}" aria-pressed="${!!o.chosen}" data-a="${a(action)}">${sp}<span>` +
      `<div class="t">${esc(o.title)}</div>${o.detail ? `<div class="d">${esc(o.detail)}</div>` : ""}${o.extra ? `<div class="x">${esc(o.extra)}</div>` : ""}</span></button>`;
  };
  const tension = (t) => {
    const acts = [];
    if (t.signature) acts.push(btn(t.kept ? "Signature kept" : "Keep as signature", { type: "signature", dim: t.signature }, t.kept ? "primary" : ""));
    if (t.dimension) acts.push(btn(t.answered ? "Change answer" : "Answer it", { type: "askAbout", dim: t.dimension }));
    return `<div class="tension"><div class="t">${esc(t.title)}</div><p class="b">${esc(t.body)}</p>` +
      `${t.source ? `<div class="src">${esc(t.source)}</div>` : ""}${acts.length ? `<div class="row">${acts.join("")}</div>` : ""}</div>`;
  };
  const header = (title, sub) => `<header><h1>${esc(title)}</h1><p>${esc(sub)}</p></header>`;

  // ---- Ask -----------------------------------------------------------------------------------
  function askPage(ask) {
    if (ask.mode === "doors") return doors(ask);
    const h = ask.header;
    const top = h.focused
      ? header("Brief", "Changing one answer · the others stay")
      : header("Brief", `${h.door} · ${h.progress}`);
    if (ask.mode === "wrap") return top + wrap(ask.wrap);
    return top + step(ask.step) + stepButtons(ask);
  }

  function doors(ask) {
    let html = header("Brief", "Six ways in") +
      `<div class="prompt">Where would you like to start?</div>` +
      `<p class="why">Start from what you already know. Every door ends at the same brief; they differ in what is asked first.</p>`;
    if (ask.carryOver) {
      html += `<p class="small">Your answers so far carry over: a door skips what is already answered.</p>`;
      html += confirming
        ? `<p class="small">Clear every answer in this brief?</p><div class="row">${btn("Clear answers", { type: "startOver" }, "primary")}${btn("Keep them", { type: "_keep" })}</div>`
        : `<div class="row">${btn("Start over", { type: "_confirm" }, "quiet")}</div>`;
    }
    html += `<div class="choices" style="margin-top:22px">` +
      ask.doors.map((d) => choice({ title: d.label, detail: d.caption, cue: d.cue }, { type: "door", id: d.id })).join("") + `</div>`;
    return html;
  }

  function step(s) {
    let html = `${s.section ? `<div class="label">${esc(s.section)}</div>` : ""}<div class="prompt">${esc(s.prompt)}</div><p class="why">${esc(s.why)}</p>`;
    switch (s.kind) {
      case "genre":
        html += s.groups.map((g) => `<div class="label">${esc(g.label)}</div><div class="choices">` +
          g.options.map((o) => choice(o, { type: "genre", key: o.key })).join("") + `</div>`).join("");
        break;
      case "uses":
        html += chips(s.options, (o) => ({ type: "use", key: o.key }));
        break;
      case "useOption":
        html += chips(s.options, (o) => ({ type: "useOption", use: s.use, question: s.question, key: o.key }));
        break;
      case "feelings":
        html += `<div class="label">${esc(s.count)}</div>` + chips(s.options, (o) => ({ type: "feeling", key: o.key }));
        break;
      case "dimension":
        html += `<div class="choices">${s.options.map((o) => choice(o, { type: "level", dim: s.dim, key: o.key })).join("")}</div>`;
        break;
      case "wordmark":
        html += `<input class="field" id="wordmark" value="${esc(s.value)}" placeholder="The name, as it will be set" autocomplete="off">` +
          ``;
        break;
      case "references":
        html += `<div class="label">${esc(s.count)}</div>`;
        if (s.chosen.length) html += `<div class="choices">${s.chosen.map((o) => choice(o, { type: "reference", key: o.key }, true)).join("")}</div>`;
        html += `<div style="margin-top:18px"><input class="field" id="search" value="${esc(s.query)}" placeholder="${esc(s.placeholder)}" autocomplete="off" spellcheck="false"></div>` +
          `<div class="label">${esc(s.label)}</div><div class="choices">${s.options.map((o) => choice(o, { type: "reference", key: o.key }, true)).join("")}</div>`;
        break;
      case "mirror":
        if (s.nothingDrawn) {
          html += `<p>Draw some letters and the guide will measure them.</p>` +
            `<div class="label">Still to draw for a surer reading</div><div class="glyphs">${esc(s.toDraw)}</div>` +
            `<p class="small">Draw them, then come back: this question waits. Or skip it and answer by eye.</p>` +
            `<div class="row">${btn("Try the example letters", { type: "example", on: true })}</div>`;
        } else {
          html += `<p class="small">Measuring Hyle Deco, this project's test font, as if you had drawn it.</p>`;
          html += `<div class="label">Reads as</div>` + s.reading.map((r) => `<p>${esc(r)}</p>`).join("");
          if (s.levels.length) {
            html += `<div class="label">What each measures as</div>` +
              s.levels.map((o) => `<div class="face">${specimen(o.cue)}<div><div class="t" style="font-weight:600">${esc(o.title)}</div><div class="d">${esc(o.detail)}</div></div></div>`).join("") +
              ``;
          }
        }
        break;
    }
    return html;
  }

  function stepButtons(ask) {
    const b = ask.buttons;
    const first = [];
    if (b.back) first.push(btn("Back", { type: "back" }));
    const second = [];
    if (b.keep) second.push(btn("Keep my answer", { type: "skip" }));
    if (b.notSure) second.push(btn("I'm not sure", { type: "skip" }));
    if (b.skip) second.push(btn("Skip", { type: "skip" }, "quiet"));
    if (ask.header.focused) return `<div class="row" style="margin-top:26px">${btn("Back", { type: "leaveFocus" })}${second.join("")}</div>`;
    return `<div style="margin-top:26px">${first.length ? `<div class="row">${first.join("")}</div>` : ""}<div class="row">${second.join("")}</div></div>`;
  }

  function wrap(w) {
    let html = `<div class="label">Your brief</div><div class="sentence" style="${genreFace()}">${esc(w.sentence)}</div><div class="note-mono">${esc(w.summary)}</div>`;
    if (w.drawFirst) {
      html += `<div class="label">${esc(w.drawLabel)}</div><div class="glyphs" style="${genreFace()}">${esc(w.drawFirst.glyphs)}</div>` +
        `<div class="item" style="margin-top:0"><div class="t">${esc(w.drawFirst.title)}</div><p>${esc(w.drawFirst.why)}</p></div>`;
    }
    if (w.toSettle.length) {
      html += `<div class="label">To settle, now or later</div>` + w.toSettle.map(tension).join("");
      if (w.moreInBrief > 0) html += `<p class="small">${w.moreInBrief} more in the Brief.</p>`;
    }
    html += `<div class="row" style="margin-top:26px">${w.more > 0 ? btn(`Ask ${w.more} more`, { type: "askMore" }) : ""}${btn("Try another door", { type: "door", id: null }, "quiet")}</div>`;
    return html;
  }

  // ---- Brief ---------------------------------------------------------------------------------
  function briefPage(b) {
    let html = header("Brief", "What your answers add up to") + `<div class="sentence" style="${genreFace()}">${esc(b.sentence)}</div>`;
    if (b.empty) html += `<p class="small">Answer a few questions in Ask and the brief fills in here.</p><div class="row">${btn("Choose a door", { type: "tab", id: "ask" }, "primary")}</div>`;
    html += `<div class="note-mono">${esc(b.note)}</div>`;
    html += `<div class="label">Targets</div>`;
    html += b.targets.length
      ? `<div class="targets">${b.targets.map((t) => `<div class="target"><div class="f">${esc(t.feature)}</div><div><div class="v">${esc(t.target)}</div>` +
        `<div class="o">${esc(t.origin)}${t.evidence ? ` · ${esc(t.evidence)}` : ""}</div></div></div>`).join("")}</div>`
      : `<p class="small">No targets yet: nothing has been chosen that a letter can be measured against.</p>`;
    html += `<div class="label">Tensions</div>` + (b.tensions.length ? b.tensions.map(tension).join("") : `<p class="small">None found: nothing you chose pulls against anything else.</p>`);
    html += `<div class="label">Faces that already fit</div>` + (b.faces.length
      ? b.faces.map((f) => `<div class="face"><span class="sp" style="${face(f.cue && f.cue.face)}">${f.cue ? "Aa" : ""}</span><div><div class="t" style="font-weight:600">${esc(f.family)}</div>` +
        `<div class="d">${esc(f.detail)}</div>${f.misses ? `<div class="src">${esc(f.misses)}</div>` : ""}</div></div>`).join("")
      : `<p class="small">None yet: they appear once the brief has targets.</p>`);
    if (!b.empty) html += `<div class="label">Next</div><p class="small">The guide turns this brief into what to draw, in what order, and why.</p><div class="row">${btn("See your guide", { type: "tab", id: "guide" }, "primary")}</div>`;
    return html;
  }

  // ---- Guide ---------------------------------------------------------------------------------
  function guidePage(g) {
    let html = header("Brief", "What to draw, and why");
    if (g.noDrawing) {
      html += `<p>Draw some letters and the guide will measure them.</p>`;
    } else if (view.exampleOn) {
      html += `<p class="small">Measuring Hyle Deco, this project's test font, as if you had drawn it.</p><div class="row">${btn("Clear the example letters", { type: "example", on: false }, "quiet")}</div>`;
    }
    for (const group of g.groups) {
      html += `<div class="label">${esc(group.word)}</div>`;
      for (const it of group.items) {
        if (it.tension) { html += tension(it.tension); continue; }
        html += `<div class="item"><div class="t">${esc(it.title)}</div>` +
          (it.glyphs ? `<div class="glyphs" style="${genreFace()}">${esc(it.glyphs)}</div>` : "") +
          `<p>${esc(it.body)}</p>` + (it.check ? `<div class="note-mono">${esc(it.check)}</div>` : "") +
          (it.source ? `<div class="src">${esc(it.source)}</div>` : "");
        if (it.action === "change") html += `<div class="row">${btn("Or change the brief", { type: "askAbout", dim: it.dim })}</div>`;
        if (it.action === "learn") html += `<div class="row">${btn("Open Learn", { type: "_learn" })}</div>`;
        html += `</div>`;
      }
    }
    if (!g.groups.length) html += `<p class="small">Nothing to advise yet: choose a style or a use in Ask.</p><div class="row">${btn("Choose a door", { type: "tab", id: "ask" })}</div>`;
    html += `<div class="label">Drawing plan</div>`;
    html += g.plan.map((p) => `<div class="item"><div class="t">${esc(p.title)}</div>` +
      (p.glyphs ? `<div class="glyphs" style="${genreFace()};font-size:30px">${esc(p.glyphs)}</div>` : "") +
      `<div class="note-mono" style="margin:4px 0">${esc(p.status)}</div><p>${esc(p.why)}</p><div class="src">${esc(p.source)}</div></div>`).join("");
    html += `<p class="small" style="margin-top:28px">Draw opens on the sheet. Come back any time: the guide measures your letters as you draw.</p>` +
      ``;
    return html;
  }

  // ---- the hand-off to Draw ------------------------------------------------------------------
  function handoffPage(h) {
    return header("Draw", "The sheet") +
      `<div class="label">Draw opens with</div><div class="glyphs big" style="${genreFace()}">${esc(h.glyphs || "n o H O")}</div>` +
      (h.title ? `<p><b>${esc(h.title)}</b></p>` : "") +
      `<p class="why">In the app, the Brief closes onto the sheet's Draw room, and the guide stays one tap away. This prototype has no drawing canvas, so it stops here.</p>` +
      `<p class="small">To see the loop close, let Hyle Deco, this project's test font, stand in for letters you drew: the guide then measures them against your brief.</p>` +
      `<div class="row">${btn("Use the example letters", { type: "_exampleToGuide" }, "primary")}${btn("Back to the guide", { type: "tab", id: "guide" })}</div>`;
  }

  // ---- the deck ------------------------------------------------------------------------------
  // The canvas `Deck` component (ui/v1-screens/Deck.dc.html), ported as drawn: the section arc
  // `M -19.3 153.6 A 527 527 0 0 1 409.3 153.6` with a 26 px ink band behind the current label, the
  // toggle arc `M 73.4 62.8 A 585 585 0 0 1 316.6 62.8` with 22 px bands, circles at (40, 71) and
  // (350, 71) of r 25 (26 filled), neighbours at 0.72 and 0.38 opacity.
  const L1 = 441.5;
  const L2 = 245.0;
  const RIGHT_NAMES = { menu: "More", next: "Next", check: "Done", none: "" };
  const sectionArcPoint = (s) => {
    const phi = -Math.asin(212.7 / 527) + s / 527;
    return [195 + 527 * Math.sin(phi), 635.02 - 527 * Math.cos(phi)];
  };
  const toggleArcPoint = (s) => {
    const phi = -Math.asin(121.6 / 585) + s / 585;
    return [195 + 585 * Math.sin(phi), 635.02 - 585 * Math.cos(phi)];
  };

  // What the right circle does on this page (the Kotlin DeckSeats table): the page's one dominant action, or the ⋯ menu.
  function rightAction() {
    if (!view || view.handoff) return null;
    if (view.tab === "guide") return { name: "Start drawing", glyph: "next", action: { type: "startDrawing" } };
    if (view.tab === "brief") return null;
    const ask = view.ask;
    if (ask.mode === "doors" || (ask.header && ask.header.focused)) return null;
    if (ask.mode === "wrap") return { name: ask.wrap.drawLabel, glyph: "next", action: { type: "startDrawing" } };
    const st = ask.step;
    if (st.kind === "wordmark") return { name: "Set", glyph: "check", action: { type: "_wordmark" } };
    if (st.kind === "mirror") {
      if (st.nothingDrawn) return { name: "Start drawing", glyph: "next", action: { type: "startDrawing" } };
      return st.levels.length ? { name: "Use these answers", glyph: "check", action: { type: "adopt" } } : null;
    }
    return ask.buttons.done ? { name: "Done", glyph: "check", action: { type: "confirm" } } : null;
  }

  // The toggle arc always holds the Brief's three views, at the doors too; the left circle is Back; the sections stay live.
  function deckConfig() {
    if (view && view.handoff) return { section: "Draw", left: "back", right: "menu", toggles: "Outline*|Fill||Construction*", dim: false };
    const on = (id, label) => (view && view.tab === id ? label + "*" : label);
    const act = rightAction();
    return { section: "Home", left: "back", right: act ? act.glyph : "menu", act, toggles: `${on("ask", "Ask")}|${on("brief", "Brief")}|${on("guide", "Guide")}`, dim: false };
  }

  function drawDeck() {
    const cfg = deckConfig();
    const cur = Math.max(0, SECTIONS.indexOf(cfg.section));
    const secs = [];
    for (let d = -2; d <= 2; d++) {
      const i = cur + d;
      const ok = i >= 0 && i < SECTIONS.length;
      const label = ok ? SECTIONS[i].toUpperCase() : "";
      const w = label.length * 7.6 + 24;
      const off = (0.5 + d * 0.2) * L1;
      secs.push({ label, off: off.toFixed(1), fill: d === 0 ? "var(--canvas)" : "var(--ink)", weight: d === 0 ? 600 : 500,
        op: !ok ? 0 : d === 0 ? 1 : Math.abs(d) === 1 ? 0.72 : 0.38,
        dash: d === 0 ? w.toFixed(1) + " 2000" : "0 2000", dashoff: (-(off - w / 2)).toFixed(1) });
    }
    const items = [];
    cfg.toggles.split("||").forEach((g, gi) => g.split("|").forEach((t, ti) => {
      const s = t.trim();
      if (!s) return;
      const on = s.endsWith("*");
      items.push({ label: (on ? s.slice(0, -1) : s).toUpperCase(), on, gap: gi > 0 && ti === 0, id: (on ? s.slice(0, -1) : s).toLowerCase() });
    }));
    const widths = items.map((it) => it.label.length * 6.4 + 13);
    const gapW = 12;
    const total = widths.reduce((x, y) => x + y, 0) + items.filter((it) => it.gap).length * gapW;
    let x = L2 / 2 - total / 2;
    const tg = [];
    items.slice(0, 6).forEach((it, k) => {
      if (it.gap) x += gapW;
      const w = widths[k];
      tg.push({ label: it.label, id: it.id, w, off: (x + w / 2).toFixed(1), fill: it.on ? "var(--canvas)" : "var(--ink)", op: 1,
        dash: it.on ? (w - 2).toFixed(1) + " 2000" : "0 2000", dashoff: (-(x + 1)).toFixed(1), mid: x + w / 2 });
      x += w;
    });
    while (tg.length < 6) tg.push({ label: "", off: "0", fill: "var(--ink)", op: 0, dash: "0 2000", dashoff: "0" });

    const L = cfg.left, R = cfg.right;
    const o = (v) => (v ? 1 : 0);
    const text = (t, size, ls, anchorId) =>
      `<text dy="${anchorId === "sa" ? 3.7 : 3.4}" style="font-size:${size}px;letter-spacing:${ls}px;font-weight:${t.weight || 500};fill:${t.fill};opacity:${t.op}"><textPath href="#${anchorId}" startOffset="${t.off}" text-anchor="middle">${esc(t.label)}</textPath></text>`;
    let svg = `<svg viewBox="0 0 390 172" aria-hidden="true"><defs><path id="sa" d="M -19.3 153.6 A 527 527 0 0 1 409.3 153.6"/><path id="ta" d="M 73.4 62.8 A 585 585 0 0 1 316.6 62.8"/></defs>`;
    svg += `<g style="opacity:${cfg.dim ? 0.3 : 1}">` +
      `<path d="M -26.3 138.1 A 544 544 0 0 1 416.3 138.1" fill="none" style="stroke:var(--line);stroke-width:1"/>` +
      `<path d="M -12.4 169.1 A 510 510 0 0 1 402.4 169.1" fill="none" style="stroke:var(--line);stroke-width:1"/>` +
      `<path d="M -19.3 153.6 A 527 527 0 0 1 409.3 153.6" fill="none" style="stroke:var(--ink);stroke-width:26;stroke-dasharray:${secs[2].dash};stroke-dashoffset:${secs[2].dashoff}"/>` +
      secs.map((t) => text(t, 10.5, 1.5, "sa")).join("") + `</g>`;
    svg += `<path d="M 70.3 48.1 A 600 600 0 0 1 319.7 48.1" fill="none" style="stroke:var(--line);stroke-width:1"/>` +
      `<path d="M 76.5 77.5 A 570 570 0 0 1 313.5 77.5" fill="none" style="stroke:var(--line);stroke-width:1"/>` +
      tg.map((t) => `<path d="M 73.4 62.8 A 585 585 0 0 1 316.6 62.8" fill="none" style="stroke:var(--ink);stroke-width:22;stroke-dasharray:${t.dash};stroke-dashoffset:${t.dashoff}"/>`).join("") +
      tg.map((t) => text(t, 9, 1, "ta")).join("");
    svg += `<g transform="translate(40 71)"><g style="opacity:${o(L === "back")}"><circle r="25" style="fill:var(--canvas);stroke:var(--ink);stroke-width:1.5"/>` +
      `<path d="M 3 -8 L -5 0 L 3 8" fill="none" style="stroke:var(--ink);stroke-width:2;stroke-linecap:square"/></g>` +
      `<g style="opacity:${o(L === "close")}"><circle r="26" style="fill:var(--red)"/>` +
      `<path d="M -7 -7 L 7 7 M 7 -7 L -7 7" fill="none" style="stroke:#FFFFFF;stroke-width:2.4;stroke-linecap:square"/></g></g>`;
    svg += `<g transform="translate(350 71)" style="opacity:${R === "none" ? 0 : 1}">` +
      `<g style="opacity:${o(R === "menu")}"><circle r="25" style="fill:var(--canvas);stroke:var(--ink);stroke-width:1.5"/>` +
      `<circle cx="-8" r="2.2" style="fill:var(--ink)"/><circle r="2.2" style="fill:var(--ink)"/><circle cx="8" r="2.2" style="fill:var(--ink)"/></g>` +
      `<g style="opacity:${o(R === "next")}"><circle r="26" style="fill:var(--ink)"/>` +
      `<path d="M -8 0 H 7 M 2 -6 L 8 0 L 2 6" fill="none" style="stroke:var(--canvas);stroke-width:2.2"/></g>` +
      `<g style="opacity:${o(R === "check")}"><circle r="26" style="fill:var(--ink)"/>` +
      `<path d="M -8 1 L -2 7 L 9 -7" fill="none" style="stroke:var(--canvas);stroke-width:2.4"/></g></g></svg>`;

    let html = svg;
    html += `<button class="dk" aria-label="${L === "close" ? "Close" : "Back"}" style="left:14px;top:45px;width:52px;height:52px;border-radius:26px" data-a="${a({ type: L === "close" ? "_close" : "_back" })}"></button>`;
    if (R !== "none") html += `<button class="dk" aria-label="${cfg.act ? esc(cfg.act.name) : RIGHT_NAMES[R]}" data-long="1" style="left:324px;top:45px;width:52px;height:52px;border-radius:26px" data-a="${a(cfg.act ? cfg.act.action : { type: "_menu" })}"></button>`;
    // Each section label is a hit target at least 44 px tall; the current one is announced as the current page.
    for (const t of secs) {
      if (!t.label) continue;
      const [px, py] = sectionArcPoint(Number(t.off));
      const w = Math.max(44, t.label.length * 7.6 + 24);
      html += `<button class="dk" aria-label="${esc(t.label[0] + t.label.slice(1).toLowerCase())}"${t.fill === "var(--canvas)" ? ' aria-current="page"' : ""} style="left:${(px - w / 2).toFixed(1)}px;top:${(py - 22).toFixed(1)}px;width:${w.toFixed(1)}px;height:44px" data-a="${a({ type: "_section", name: t.label })}"></button>`;
    }
    for (const t of tg) {
      if (!t.label) continue;
      const [px, py] = toggleArcPoint(t.mid);
      const action = view && view.handoff ? { type: "_drawToggle" } : { type: "tab", id: t.id };
      html += `<button class="dk" aria-label="${esc(t.label[0] + t.label.slice(1).toLowerCase())}" aria-pressed="${t.fill === "var(--canvas)"}" style="left:${(px - t.w / 2).toFixed(1)}px;top:${(py - 22).toFixed(1)}px;width:${t.w.toFixed(1)}px;height:44px" data-a="${a(action)}"></button>`;
    }
    deck.innerHTML = html;
    const k = Math.min(1, window.innerWidth / 390);
    deck.style.transform = k < 1 ? `scale(${k})` : "";
  }

  function openMenu() {
    const items = [
      ["Command…", "In the app: Ctrl or ⌘ K", "_command"],
      [view.exampleOn ? "Clear the example letters" : "Use the example letters", "Hyle Deco stands in for your drawing", "_toggleExample"],
      ["Try another door", "Go back to the six doors", "_doors"],
      ["Start over", "Clear every answer", "_startOverMenu"],
      ["Read the brief", "What your answers add up to", "_readBrief"],
      ["See your guide", "What to draw, and why", "_guide"],
      ["About this prototype", "What runs here", "_about"],
    ];
    menu.innerHTML = items.map(([t, k, type]) => `<button data-a="${a({ type })}">${esc(t)}<span class="k">${esc(k)}</span></button>`).join("");
    menu.hidden = false;
  }

  // ---- render and act ------------------------------------------------------------------------
  function render(scrollTop) {
    let html;
    if (view.handoff) html = handoffPage(view.handoff);
    else if (view.tab === "brief") html = briefPage(view.brief);
    else if (view.tab === "guide") html = guidePage(view.guide);
    else html = askPage(view.ask);
    const active = document.activeElement && document.activeElement.id;
    app.innerHTML = html;
    app.classList.toggle("fresh", !!scrollTop);
    drawDeck();
    if (active === "search") {
      const s = document.getElementById("search");
      s.focus();
      s.setSelectionRange(s.value.length, s.value.length);
    }
    if (scrollTop) window.scrollTo(0, 0);
  }

  const where = (v) => v.handoff ? "handoff" : v.tab + ":" + (v.ask.mode === "step" ? v.ask.step.id : v.ask.mode);

  function send(action) {
    const before = where(view);
    view = JSON.parse(engine.act(JSON.stringify(action)));
    render(where(view) !== before);
  }

  function local(action) {
    switch (action.type) {
      case "_confirm": confirming = true; render(false); return;
      case "_keep": confirming = false; render(false); return;
      case "_wordmark": send({ type: "wordmark", text: document.getElementById("wordmark").value }); return;
      case "_exampleToGuide": send({ type: "example", on: true }); send({ type: "tab", id: "guide" }); return;
      case "_learn": say("In the app this opens Learn, on the lineages lesson."); return;
      case "_drawToggle": say("Draw's toggles work in the app; this prototype has no canvas."); return;
      case "_command": say("The command palette is the first item of every ⋯ menu in the app."); return;
      case "_toggleExample": send({ type: "example", on: !view.exampleOn }); say(view.exampleOn ? "Measuring Hyle Deco as your letters." : "Example letters cleared."); return;
      case "_startOverMenu": confirming = true; send({ type: "tab", id: "ask" }); send({ type: "door", id: null }); return;
      case "_about": say("The real Brief engine, compiled to JavaScript, with the real style atlas. Nothing leaves this page."); return;
      case "_close": say("In the app, Close leaves the Brief and returns to where you came from; nothing is lost until you create the project."); return;
      case "_next": say("In the app, Next on the doors goes on to the guide once there is an answer."); return;
      case "_doors": send({ type: "tab", id: "ask" }); send({ type: "door", id: null }); return;
      case "_readBrief": send({ type: "tab", id: "brief" }); return;
      case "_guide": send({ type: "tab", id: "guide" }); return;
      case "_section": say(action.name[0] + action.name.slice(1).toLowerCase() + " is another section: in the app a tap, a swipe along the arc, the arrow keys or a digit goes there."); return;
      case "_menu": if (menu.hidden) openMenu(); else menu.hidden = true; return;
      case "_back": {
        const before = JSON.stringify(view);
        send({ type: "back" });
        if (JSON.stringify(view) === before) say("Back goes to Home in the app.");
        return;
      }
    }
    if (action.type === "startOver") confirming = false;
    send(action);
  }

  document.addEventListener("contextmenu", (e) => {
    if (e.target.closest("[data-long]")) { e.preventDefault(); openMenu(); }
  });
  document.addEventListener("click", (e) => {
    const el = e.target.closest("[data-a]");
    if (!menu.hidden && !e.target.closest("#menu")) menu.hidden = true;
    if (!el) return;
    if (el.closest("#menu")) menu.hidden = true;
    local(JSON.parse(el.getAttribute("data-a")));
  });
  document.addEventListener("input", (e) => {
    if (e.target.id === "search") send({ type: "query", text: e.target.value });
  });
  document.addEventListener("keydown", (e) => {
    if (e.target.id === "wordmark" && e.key === "Enter") local({ type: "_wordmark" });
    if (e.key === "Escape" && !e.target.closest("input")) local({ type: "_back" });
  });
  window.addEventListener("resize", () => view && drawDeck());

  const atlas = document.getElementById("atlas").textContent;
  const example = document.getElementById("example-font").textContent.trim();
  view = JSON.parse(engine.start(atlas, example));
  render(false);
})();
</script>
