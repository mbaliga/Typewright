<!doctype html>
<!-- SPDX-License-Identifier: FSL-1.1-ALv2 -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Capture, cells</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
@font-face { font-family: "Hyle Deco"; src: url(/_blob/87ef2c1f7693e8b7acd70e03d6088e45) format("truetype"); }
body { margin: 0; background: #EFE9DC; }
.m { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; }
.hy { font-family: "Hyle Deco", serif; }
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #EFE9DC; color: #17150F; font-family: 'IBM Plex Sans', system-ui, sans-serif">
<svg width="390" height="844" style="position: absolute; left: 0; top: 0; opacity: 0.55; mix-blend-mode: multiply; pointer-events: none" aria-hidden="true"><filter id="gr"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"></feTurbulence><feColorMatrix values="0 0 0 0 0.35 0 0 0 0 0.3 0 0 0 0 0.22 0 0 0 0.26 0"></feColorMatrix></filter><rect width="390" height="844" filter="url(#gr)"></rect></svg>

<div style="position: absolute; left: 22px; top: 56px; right: 22px; display: flex; flex-direction: column; gap: 3px">
<div style="font-size: 15px; font-weight: 600">Sheet 1 · cells</div>
<div class="m" style="color: #6F6A5E; font-size: 9.5px">22 read · 2 need you</div>
</div>

<div style="position: absolute; left: 22px; top: 118px; width: 346px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); row-gap: 8px; column-gap: 10px">
<sc-for list="{{cells}}" as="c" hint-placeholder-count="20">
<div style="height: 84px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; background: {{c.bg}}; color: {{c.fg}}">
<span class="hy" style="font-size: 32px; line-height: 1; display: inline-block; transform: rotate({{c.rot}}deg)">{{c.g}}</span>
<span class="m" style="font-size: 9.5px; opacity: 0.75">{{c.label}}</span>
</div>
</sc-for>
</div>

<div style="position: absolute; left: 96px; top: 318px; width: 180px; background: #EFE9DC; padding: 10px 0 10px 14px; display: flex; flex-direction: column; gap: 10px">
<div class="m" style="font-size: 9px; color: #6F6A5E">Cell 12 · most likely first</div>
<div style="display: flex; gap: 10px; align-items: baseline; background: #17150F; color: #EFE9DC; padding: 4px 8px; margin-left: -8px"><span class="hy" style="font-size: 20px">l</span><span class="m" style="font-size: 9.5px">lowercase L</span></div>
<div style="display: flex; gap: 10px; align-items: baseline"><span class="hy" style="font-size: 20px">I</span><span class="m" style="font-size: 9.5px">capital i</span></div>
<div style="display: flex; gap: 10px; align-items: baseline"><span class="hy" style="font-size: 20px">1</span><span class="m" style="font-size: 9.5px">digit one</span></div>
<div class="m" style="font-size: 9px; color: #6F6A5E">Or type any name</div>
</div>

<div style="position: absolute; left: 0; top: 672px; width: 390px; height: 172px">
<dc-import name="Deck" section="Capture" left="back" right="plus" toggles="Sheets|Cells*" hint-size="390px,172px"></dc-import>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const letters = 'ABCDEFGHIJK?MNOP?RSTUVWX'.split('');
    const rots = [-2, 1.5, -1, 2.5, -3, 0.5, 2, -1.5, 1, -2.5, 3, -0.5, 1.5, -2, 2.5, -1, 0.5, -3, 2, -1.5];
    const cells = letters.slice(0, 20).map((g, i) => {
      const unsure = g === '?';
      const shown = unsure ? (i === 11 ? 'l' : 'O') : g;
      return {
        g: shown,
        label: unsure ? (i === 11 ? 'l or I ?' : 'O or Q ?') : g,
        rot: rots[i],
        bg: unsure ? '#17150F' : 'transparent',
        fg: unsure ? '#EFE9DC' : '#17150F'
      };
    });
    return { cells: cells };
  }
}
</script>
</body>
</html>
