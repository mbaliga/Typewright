<div style="position: absolute; left: 0; top: 672px; width: 390px; height: 172px">
<dc-import name="Deck" section="Check" left="back" right="refresh" toggles="Report|Economy*" hint-size="390px,172px"></dc-import>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    // Real: Hyle Deco counts; sans-geometric min/q1/median/q3/max from data/node-economy-latin.json.
    const data = [
      ['H', 1252, 12, 12, 12, 18, 44], ['L', 746, 6, 6, 6, 10.75, 26], ['Z', 1086, 8, 10, 12, 17, 46],
      ['Y', 986, 9, 9, 10, 16.25, 39], ['F', 911, 10, 10, 10, 16.25, 38], ['E', 1092, 12, 12, 12, 20, 48],
      ['I', 508, 4, 4, 4, 12, 20], ['A', 517, 11, 12, 12, 18.5, 43], ['e', 224, 20, 24, 26.5, 30, 48],
      ['a', 183, 19, 28, 31, 35.75, 102], ['R', 124, 17, 21, 23, 26, 82]
    ];
    const x = (v) => (58 + Math.log(v / 3) / Math.log(1000) * 282).toFixed(1);
    const rows = data.map((d) => ({
      g: d[0],
      n: d[1].toLocaleString('en-US'),
      pt: x(d[1]), lo: x(d[2]), q1: x(d[3]), md: x(d[4]), hi: x(d[6]),
      qw: Math.max(1.5, parseFloat(x(d[5])) - parseFloat(x(d[3]))).toFixed(1)
    }));
    return { rows: rows };
  }
}
</script>
</body>
