<html lang="en">
<head>
<meta charset="utf-8">
<title>Rich context menu, touch</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body { margin: 0; background: #EFE9DC; }
.m { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; }
.sec { font-family: 'IBM Plex Mono', monospace; font-size: 8.5px; letter-spacing: 0.14em; text-transform: uppercase; color: #6F6A5E; padding: 10px 0 2px; }
.row { display: flex; align-items: center; gap: 10px; min-height: 36px; border: 0; background: transparent; padding: 0; text-align: left; color: #17150F; width: 100%; font-family: inherit; }
.lb { display: flex; flex-direction: column; gap: 1px; flex-grow: 1; }
.v { font-size: 13.5px; }
.cq { font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; letter-spacing: 0.04em; color: #6F6A5E; }
.g { font-family: 'IBM Plex Mono', monospace; font-size: 8.5px; letter-spacing: 0.06em; background: #17150F; color: #E6DFD1; padding: 2px 5px; white-space: nowrap; }
.k { font-family: 'IBM Plex Mono', monospace; font-size: 8.5px; letter-spacing: 0.06em; color: #6F6A5E; width: 64px; text-align: right; white-space: nowrap; }
.off .v, .off .g { opacity: 0.4; }
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #EFE9DC; color: #17150F; font-family: 'IBM Plex Sans', system-ui, sans-serif">
<svg width="390" height="844" style="position: absolute; left: 0; top: 0; opacity: 0.55; mix-blend-mode: multiply; pointer-events: none" aria-hidden="true"><filter id="gr"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"></feTurbulence><feColorMatrix values="0 0 0 0 0.35 0 0 0 0 0.3 0 0 0 0 0.22 0 0 0 0.26 0"></feColorMatrix></filter><rect width="390" height="844" filter="url(#gr)"></rect></svg>

<svg width="390" height="844" viewBox="0 0 390 844" style="position: absolute; left: 0; top: 0; opacity: 0.35" aria-hidden="true">
<path fill-rule="evenodd" d="M 155.9 520.0 L 233.7 520.0 C 268.9 520.0 297.4 491.5 297.4 456.3 L 297.4 313.7 C 297.4 278.5 268.9 250.0 233.7 250.0 L 155.9 250.0 C 120.7 250.0 92.2 278.5 92.2 313.7 L 92.2 456.3 C 92.2 491.5 120.7 520.0 155.9 520.0 Z M 155.9 496.2 L 233.7 496.2 C 255.7 496.2 273.6 478.4 273.6 456.3 L 273.6 313.7 C 273.6 291.6 255.7 273.8 233.7 273.8 L 155.9 273.8 C 133.8 273.8 115.9 291.6 115.9 313.7 L 115.9 456.3 C 115.9 478.4 133.8 496.2 155.9 496.2 Z" fill="rgba(23,21,15,0.07)" stroke="#17150F" stroke-width="1.5"></path>
<circle cx="297.4" cy="313.7" r="4.2" fill="#5F4BE0"></circle>
</svg>

<div style="position: absolute; left: 22px; top: 52px; right: 22px; display: flex; flex-direction: column; gap: 3px">
<div style="font-size: 15px; font-weight: 600">o · 16 on · 16 off</div>
<div class="m" style="color: #6F6A5E; font-size: 9.5px">Rounded rectangle · flat top and bottom</div>
</div>

<div style="position: absolute; left: 0; top: 150px; width: 390px; height: 530px; background: linear-gradient(to bottom, rgba(230,223,209,0) 0, #E6DFD1 36px, #E6DFD1 100%)"></div>

<div style="position: absolute; left: 22px; right: 22px; top: 176px; display: flex; flex-direction: column">
<div style="display: flex; align-items: baseline; gap: 10px"><span style="font-size: 14px; font-weight: 600">1 node · 427, 382 · smooth</span><span class="cq">outer contour</span></div>
<div style="display: flex; align-items: center; gap: 8px; margin-top: 10px; padding-bottom: 5px; border-bottom: 1px solid rgba(23,21,15,0.3)">
<svg width="12" height="12" aria-hidden="true"><circle cx="5" cy="5" r="4" fill="none" stroke="#6F6A5E" stroke-width="1.3"></circle><path d="M 8 8 L 11.5 11.5" stroke="#6F6A5E" stroke-width="1.3"></path></svg>
<label for="find" class="cq" style="position: absolute; left: -9999px">Find a command</label>
<input id="find" placeholder="Find a command" style="border: 0; background: transparent; font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; color: #17150F; outline: none; flex-grow: 1; padding: 0">
</div>

<div class="sec">Recent</div>
<button class="row"><span class="lb"><span class="v">Make corner</span><span class="cq">smooth → corner</span></span><span class="g">hold · ↘</span><span class="k">Enter</span></button>

<div class="sec">This node</div>
<button class="row"><span class="lb"><span class="v">Delete node, keep the curve</span><span class="cq">−1 on · −1 off</span></span><span class="g">hold · ↓</span><span class="k">⌫</span></button>
<button class="row"><span class="lb"><span class="v">Split the contour here</span><span class="cq">+1 on · opens the contour</span></span><span class="g">hold · ←</span><span class="k">Ctrl ⇧ K</span></button>
<button class="row off"><span class="lb"><span class="v">Align to a metric line</span><span class="cq">nothing within 20 units</span></span><span class="g">hold · ↗</span><span class="k">Ctrl ⇧ A</span></button>

<div class="sec">This contour</div>
<button class="row off"><span class="lb"><span class="v">Add extremes</span><span class="cq">already has its extremes</span></span><span class="g">hold · ↙</span><span class="k">Ctrl ⇧ E</span></button>
<button class="row"><span class="lb"><span class="v">Reverse direction</span><span class="cq">counter-clockwise → clockwise · the counter would fill</span></span><span class="g">hold · ↑</span><span class="k">Ctrl Alt R</span></button>
<button class="row"><span class="lb"><span class="v">Tidy with live count</span><span class="cq">no change · 8 on · 8 off</span></span><span class="k" style="width: auto">Ctrl ⇧ Y</span></button>

<div class="sec">This glyph</div>
<button class="row"><span class="lb"><span class="v">Lock as approved</span><span class="cq">edits then need an unlock and keep a diff</span></span><span class="k">Ctrl L</span></button>
<button class="row"><span class="lb"><span class="v">● Clear glyph</span><span class="cq">−16 on · −16 off · undo restores it</span></span><span class="k">—</span></button>
</div>

<div style="position: absolute; left: 0; top: 672px; width: 390px; height: 172px">
<dc-import name="Deck" section="Draw" left="close" right="menu" toggles="Outline*|Fill||Construction*" hint-size="390px,172px"></dc-import>
</div>
</div>
</x-dc>

</html>
