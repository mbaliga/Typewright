/* Layout: one phone-width column on paper; ink blocks mark the selected answer; the deck sits at the foot. */
:root{--canvas:#EFE9DC;--ink:#17150F;--muted:#6F6A5E;--line:rgba(23,21,15,.2);--violet:#5F4BE0;--paper-on-ink:#EFE9DC;
--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;--sans:"IBM Plex Sans",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--canvas:#0B0B0A;--ink:#F3F3F0;--muted:#8E8E89;--line:rgba(255,255,255,.22);--violet:#8E7BFF;--paper-on-ink:#0B0B0A;color-scheme:dark}}
:root[data-theme="dark"]{--canvas:#0B0B0A;--ink:#F3F3F0;--muted:#8E8E89;--line:rgba(255,255,255,.22);--violet:#8E7BFF;--paper-on-ink:#0B0B0A;color-scheme:dark}
body{background:var(--canvas);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;padding-inline:16px}
*{box-sizing:border-box}
.app{max-width:440px;margin:0 auto;padding-block:20px 150px}
header h1{font-size:15px;font-weight:600;margin:0}
header p{font:11px var(--mono);color:var(--muted);margin:2px 0 0}
.sentence{font-size:26px;line-height:1.2;margin:28px 0 8px;text-wrap:balance}
.sentence.cue{transition:font-family 0s}
.note{font:11px var(--mono);color:var(--muted)}
.kicker{font:11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:28px 0 10px}
.door,.card{display:block;width:100%;text-align:left;background:none;color:inherit;border:0;border-top:1px solid var(--line);padding:16px 0;cursor:pointer;font:inherit}
.door{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:center}
.door .sp{font-size:40px;line-height:1}
.door b{display:block;font-weight:600}
.door span.c{color:var(--muted);font-size:13px}
.q{font-size:20px;line-height:1.25;margin:22px 0 6px;font-weight:600;text-wrap:balance}
.why{color:var(--muted);font-size:13px;margin:0 0 14px}
.card{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;border:1px solid var(--line);border-top:1px solid var(--line);padding:12px 14px;margin-bottom:8px}
.card .sp{font-size:44px;line-height:1.05;grid-row:span 2}
.card .w{font-weight:600}.card .p{color:var(--muted);font-size:13px;grid-column:2}
.card[aria-pressed=true]{border:2px solid var(--violet);padding:11px 13px}
.card[aria-pressed=true] .w::after{content:" · CHOSEN";font:10px var(--mono);color:var(--violet)}
.skip{font:12px var(--mono);background:none;border:0;color:var(--muted);text-decoration:underline;padding:10px 0;margin-right:16px;cursor:pointer}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{text-align:left;padding:8px 6px 8px 0;border-top:1px solid var(--line);vertical-align:top}
th{font:10px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:400}
td.m{font-family:var(--mono);font-size:12px}
.tension{border-left:3px solid var(--ink);padding:2px 0 2px 12px;margin:12px 0}
.tension b{display:block}.tension .src{font:10px var(--mono);color:var(--muted)}
.tension button{font:11px var(--mono);margin-top:6px;background:none;border:1px solid var(--line);color:inherit;padding:4px 8px;cursor:pointer}
.tension button[aria-pressed=true]{background:var(--ink);color:var(--paper-on-ink)}
.glyphs{font-size:34px;letter-spacing:.12em;margin:4px 0}
.step{border-top:1px solid var(--line);padding:12px 0}
.step b{font-weight:600}
.deck{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--canvas) 70%,transparent)}
.deck-in{max-width:440px;margin:0 auto;display:flex;align-items:center;gap:10px;justify-content:space-between}
.circle{width:52px;height:52px;border-radius:50%;border:1.5px solid var(--ink);background:none;color:var(--ink);font-size:22px;cursor:pointer;flex:none}
.seg{display:flex;flex:1;justify-content:center}
.seg button{font:12px var(--mono);padding:10px 14px;border:0;background:none;color:var(--ink);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--paper-on-ink)}
.arc{font:11px var(--mono);color:var(--muted);text-align:center;margin-top:6px}
.arc b{background:var(--ink);color:var(--paper-on-ink);padding:3px 8px;font-weight:400}
button:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
.pill{display:inline-block;font:10px var(--mono);border:1px solid var(--ink);padding:1px 6px;margin-right:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:none;color:inherit;padding:8px 12px;font:inherit;cursor:pointer;display:flex;gap:10px;align-items:baseline}
.chip .sp{font-size:24px}
.chip[aria-pressed=true]{border:2px solid var(--violet);padding:7px 11px}
</style>

<div class="seg" id="seg"></div><button class="circle" aria-label="More">⋯</button></div>

 {k:"deco",n:"art deco",lab:"Art deco",face:"deco",s:"Rg"},
 {k:"didone",n:"didone",lab:"Didone",face:"didone",s:"Rg"},
 {k:"geometric",n:"geometric",lab:"Geometric",face:"geometric",s:"Rg"},
 {k:"humanist",n:"humanist",lab:"Humanist",face:"humanist",s:"Rg"},
 {k:"slab",n:"slab",lab:"Slab",face:"slab",s:"Rg"}];
var DIMS=[
 {id:"contrast",q:"How much does the stroke thicken and thin?",why:"Contrast is the first thing the eye reads in a serif or display face.",lv:[
  {id:"even",w:"Even",p:"monoline",f:"geometric",s:"o",ph:"monoline"},
  {id:"gentle",w:"Gentle",p:"gently modulated",f:"humanist",s:"o",ph:"gently modulated"},
  {id:"strong",w:"Strong",p:"high-contrast",f:"transitional",s:"o",ph:"high-contrast"},
  {id:"extreme",w:"Extreme",p:"hairline-contrast",f:"didone",s:"o",ph:"hairline-contrast"}]},
 {id:"roundness",q:"What shape are the round letters?",why:"Roundness separates geometric, squarish and technical faces.",lv:[
  {id:"circle",w:"Circles",p:"circular rounds",f:"geometric",s:"o",ph:"circular rounds"},
  {id:"softSquare",w:"Squarish",p:"squarish rounds",f:"superellipse",s:"o",ph:"squarish rounds"},
  {id:"square",w:"Square",p:"square rounds",f:"techno",s:"o",ph:"square rounds"}]},
 {id:"width",q:"How wide are the letters?",why:"Width decides how many letters fit a line, and how the face feels at a glance.",lv:[
  {id:"narrow",w:"Narrow",p:"narrow",f:"condensed",s:"HO",ph:"narrow"},
  {id:"normal",w:"Normal",p:"normal width",f:"grotesque",s:"HO",ph:"normal width"},
  {id:"wide",w:"Wide",p:"wide",f:"superellipse",s:"HO",ph:"wide"}]}];
var st={tab:"Ask",door:null,genre:null,ans:{},sig:false,step:0};
var DOORS=[["Style","I know the name of it","deco","Rg"],["Use","I know where it will live","grotesque","Aa"],["References","I know fonts I like","didone","Bb"],["Feeling","I know how it should feel","rounded","Cc"],["Mirror","I have already drawn letters","script","Dd"],["Blank","I know nothing yet","mono","Ee"]];
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function sentence(){var g=GENRES.find(function(x){return x.k===st.genre});
 var ph=DIMS.map(function(d){var l=d.lv.find(function(x){return x.id===st.ans[d.id]});return l&&l.ph}).filter(Boolean);
 if(!g&&!ph.length)return "Nothing answered yet.";
 var noun=g?g.n+" typeface":"typeface";var a=/^[aeiou]/i.test(noun)?"An ":"A ";
 var body=ph.length?": "+(ph.length>1?ph.slice(0,-1).join(", ")+" and "+ph[ph.length-1]:ph[0]):"";
 return a+noun+body+"."}
function render(){var A=document.getElementById("app"),h="";
 var g=GENRES.find(function(x){return x.k===st.genre});var ff=g?"cue-"+g.face:"var(--sans)";
 h+='<header><h1>Brief</h1><p>'+(st.tab==="Ask"?"six ways in":"example project · Hyle Deco")+'</p></header>';
 if(st.tab==="Ask"){
  if(!st.door){h+='<div class="kicker">Where do you want to start?</div>';
   DOORS.forEach(function(d){h+='<button class="door" data-door="'+d[0]+'"><span class="sp" style="font-family:cue-'+d[2]+'">'+d[3]+'</span><span><b>'+d[0]+'</b><span class="c">'+d[1]+'</span></span></button>'});
   h+='<p class="note" style="margin-top:20px">Every door ends in the same record. Skip anything you are unsure of.</p>';}
  else if(st.step===0){h+='<div class="q">What kind of letter is it, closest to?</div><p class="why">Pick the nearest. You can change it later; the next questions adapt.</p><div class="chips">';
   GENRES.forEach(function(x){h+='<button class="chip" data-genre="'+x.k+'" aria-pressed="'+(st.genre===x.k)+'"><span class="sp" style="font-family:cue-'+x.face+'">'+x.s+'</span><span>'+x.lab+'</span></button>'});
   h+='</div><p style="margin-top:16px"><button class="skip" data-next="1">I\'m not sure</button></p>';}
  else if(st.step<=DIMS.length){var d=DIMS[st.step-1];
   h+='<div class="note">'+st.step+' of '+DIMS.length+'</div><div class="q">'+d.q+'</div><p class="why">'+d.why+'</p>';
   d.lv.forEach(function(l){h+='<button class="card" data-lv="'+d.id+':'+l.id+'" aria-pressed="'+(st.ans[d.id]===l.id)+'"><span class="sp" style="font-family:cue-'+l.f+'">'+l.s+'</span><span class="w">'+l.w+'</span><span class="p">'+l.p+'</span></button>'});
   h+='<p><button class="skip" data-next="1">I\'m not sure</button><button class="skip" data-next="1">Skip</button></p>';}
  else{h+='<div class="q">That is enough to start.</div><p class="why">Open the Brief to see what you asked for, where it pulls against itself, and what to draw first.</p><p><button class="card" data-tab="Brief"><span class="w">See the Brief</span><span></span></button></p>';}
 }
 if(st.tab==="Brief"){
  h+='<div class="sentence" style="font-family:'+ff+'">'+esc(sentence())+'</div><div class="note">Saved in the project. Numbers come from the style atlas when shown.</div>';
  h+='<div class="kicker">Targets</div><table><tr><th>Feature</th><th>Target</th><th>From</th></tr>';
  var rows=[];
  if(st.ans.contrast)rows.push(["Contrast",{even:"1.0–1.2 : 1",gentle:"1.2–1.6 : 1",strong:"1.6–2.4 : 1",extreme:"2.4 : 1 and up"}[st.ans.contrast]+" (example)","your answer"]);
  if(st.ans.roundness)rows.push(["Roundness",DIMS[1].lv.find(function(l){return l.id===st.ans.roundness}).p,"your answer"]);
  if(st.ans.width)rows.push(["Width",DIMS[2].lv.find(function(l){return l.id===st.ans.width}).p,"your answer"]);
  if(g)rows.push(["Genre",g.n,"8 faces in the atlas"]);
  if(!rows.length)rows.push(["—","Answer a question to set a target","—"]);
  rows.forEach(function(r){h+='<tr><td>'+r[0]+'</td><td class="m">'+r[1]+'</td><td class="note">'+r[2]+'</td></tr>'});h+='</table>';
  if(st.genre==="deco"&&st.ans.roundness==="softSquare"){h+='<div class="kicker">Where your answers pull apart</div><div class="tension"><b>Squarish rounds are unusual for art deco</b><span>None of the 8 art deco faces in the atlas have squarish rounds.</span><div class="src">MEASURED · style atlas</div><button data-sig="1" aria-pressed="'+st.sig+'">Keep as signature</button></div>';}
  if(st.genre==="grotesque"){h+='<div class="kicker">Where your answers pull apart</div><div class="tension"><b>Small x-height is unusual for a grotesque</b><span>Only 3 of the 30 grotesque faces in the atlas have a small x-height.</span><div class="src">MEASURED · style atlas</div></div>';}
  h+='<div class="kicker">Faces that already fit</div><div class="note">Named from the atlas, nearest first. Your letters are never compared to a font you have not chosen.</div>';
 }
 if(st.tab==="Guide"){
  h+='<div class="kicker" style="margin-top:22px">Next</div><div class="step"><b>Draw these first</b><div class="glyphs" style="font-family:'+ff+'">n o H O</div><span class="why">They carry contrast, stress and width, so the brief can start measuring.</span></div>';
  h+='<div class="kicker">Drift</div><div class="step"><span class="pill">NEAR</span><b>Contrast: 1.3 : 1</b><div class="why">The brief asks for 1.0 to 1.2 : 1 (your answer: Even). Thin the stems of H, then bring the other letters to match. Example reading.</div></div>';
  h+='<div class="kicker">Then</div><div class="step"><b>Figures</b><div class="glyphs" style="font-family:'+ff+'">0 1 2 3</div></div><div class="step"><b>Capitals</b></div><div class="note" style="margin-top:14px">Guidance only. The Brief never changes your outlines.</div>';
 }
 A.innerHTML=h;
 var seg=document.getElementById("seg");seg.innerHTML=["Ask","Brief","Guide"].map(function(t){return '<button data-tab="'+t+'" aria-pressed="'+(st.tab===t)+'">'+t+'</button>'}).join("");
}
document.addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;
 if(b.dataset.tab){st.tab=b.dataset.tab}
 else if(b.id==="back"){if(st.tab!=="Ask")st.tab="Ask";else if(st.step>0)st.step--;else st.door=null}
 else if(b.dataset.door){st.door=b.dataset.door;st.step=0}
 else if(b.dataset.genre){st.genre=b.dataset.genre;st.step=1}
 else if(b.dataset.lv){var p=b.dataset.lv.split(":");st.ans[p[0]]=p[1];st.step++}
 else if(b.dataset.next){st.step++}
 else if(b.dataset.sig){st.sig=!st.sig}
 render();window.scrollTo(0,0)});
render();
</script>
