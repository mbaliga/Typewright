name: iOS

# Builds and tests the iPad port on GitHub's macOS runners (docs/IOS_PORT.md). Everything here is
# UNSIGNED: no secret, certificate or profile is read, and nothing is uploaded except on a version
# tag. Actions are pinned to commit SHAs (tag in the trailing comment). This workflow has not run
# yet, so every claim it makes is CI-LANE-WRITTEN until a run is seen. Private repositories bill
# hosted macOS minutes at a higher rate; the cores job is the cheap one.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "app-ios/**"
      - "**/src/iosMain/**"
      - "build-logic/**"
      - "settings.gradle.kts"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

concurrency:
  group: ios-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cores:
    name: pure modules on the iOS simulator
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          cache-provider: basic
      - name: Shell scripts parse and stage the data packs
        run: |
          bash -n app-ios/scripts/stage-resources.sh
          bash app-ios/scripts/test-stage-resources.sh
      - name: Pick an installed iPhone simulator
        run: |
          name="$(xcrun simctl list devices available | sed -n 's/^ *\(iPhone [^(]*[^( ]\) (.*/\1/p' | head -n 1)"
          test -n "$name"
          echo "Using simulator: $name"
          echo "TYPEWRIGHT_IOS_SIM=$name" >> "$GITHUB_ENV"
      - name: Stage the data packs the simulator tests read
        run: |
          app-ios/scripts/stage-resources.sh "$RUNNER_TEMP/typewright-resources"
          echo "TYPEWRIGHT_RESOURCES=$RUNNER_TEMP/typewright-resources" >> "$GITHUB_ENV"
      - name: Run each pure module's common tests as iosSimulatorArm64Test
        run: >
          env -u ANDROID_HOME -u ANDROID_SDK_ROOT ./gradlew
          -Ptypewright.android=false -Ptypewright.ios=true --continue
          :core-geometry:iosSimulatorArm64Test
          :core-font:iosSimulatorArm64Test
          :engine-trace:iosSimulatorArm64Test
          :engine-construct:iosSimulatorArm64Test
          :qa:corpus:iosSimulatorArm64Test
          :qa:iosSimulatorArm64Test
          :learn:iosSimulatorArm64Test
          :learn:scenes:iosSimulatorArm64Test
          :campaign:iosSimulatorArm64Test
          :scripts:iosSimulatorArm64Test
          :project:iosSimulatorArm64Test

  app:
    name: unsigned iPad app (simulator and device slices)
    runs-on: macos-latest
    timeout-minutes: 90
    needs: cores
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          cache-provider: basic
      - name: Android SDK packages the platform modules need
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the Xcode project
        working-directory: app-ios/iosApp
        run: xcodegen generate
      - name: Build for the iOS simulator, unsigned
        run: >
          xcodebuild build
          -project app-ios/iosApp/Typewright.xcodeproj -scheme Typewright
          -configuration Debug -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/dd-sim"
          CODE_SIGNING_ALLOWED=NO
      - name: Build for an iPad, unsigned (compile and link only)
        run: >
          xcodebuild build
          -project app-ios/iosApp/Typewright.xcodeproj -scheme Typewright
          -configuration Release -sdk iphoneos
          -destination 'generic/platform=iOS'
          -derivedDataPath "$RUNNER_TEMP/dd-dev"
          CODE_SIGNING_ALLOWED=NO
      - name: The data packs and privacy manifest are in the bundle
        run: |
          app="$RUNNER_TEMP/dd-sim/Build/Products/Debug-iphonesimulator/Typewright.app"
          test -f "$app/typewright-resources/typewright/learn-faces/manifest.json"
          test -f "$app/typewright-resources/campaign/workbook-latin.yaml"
          test -f "$app/PrivacyInfo.xcprivacy"
          plutil -lint "$app/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$app/Info.plist"
      - name: Zip the unsigned simulator app
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cd "$RUNNER_TEMP/dd-sim/Build/Products/Debug-iphonesimulator"
          ditto -c -k --keepParent Typewright.app "$GITHUB_WORKSPACE/Typewright-simulator-UNSIGNED.zip"
      - name: Upload the unsigned simulator app (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        continue-on-error: true # the account's artifact storage has been full before
        with:
          name: Typewright-simulator-UNSIGNED
          path: Typewright-simulator-UNSIGNED.zip
          if-no-files-found: error
