name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or pull request cancels the run it supersedes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Pull requests upload nothing. Pushes to main upload three artifacts -- the debug APK, the Linux
# desktop distributable and the web production bundle -- with 7-day retention, so the owner can
# sideload and verify them (CLAUDE.md law 4: on-device behaviour is owner-verified only). Every
# upload step is continue-on-error: true, because the owner's account is at its Actions storage
# limit and an upload failure must never fail the build.
jobs:
  core:
    name: core (pure modules, no Android SDK)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # docs/LICENSING.md: every source file has its SPDX line, and no Apache-2.0 module
      # depends on an FSL-1.1-ALv2 module.
      - name: Licence split
        run: python3 tools/check_licences.py
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
        with:
          # The MIT-licensed cache; the default "enhanced" cache is a proprietary component.
          cache-provider: basic
      # The runner image ships an Android SDK; unset it so this job proves CLAUDE.md law 2.
      # -Ptypewright.android=false also leaves the Android-bearing projects out of the build.
      - name: JVM tests and ktlint, SDK-free
        run: env -u ANDROID_HOME -u ANDROID_SDK_ROOT ./gradlew -Ptypewright.android=false jvmTest spotlessCheck

  android:
    name: android (assembleDebug, platform-module tests)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
        with:
          # The MIT-licensed cache; the default "enhanced" cache is a proprietary component.
          cache-provider: basic
      - name: Android SDK packages the build needs
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null
      - name: Debug APK
        run: ./gradlew :app-android:assembleDebug
      - name: Platform-module tests (desktop JVM, Android host, screenshot harness)
        run: ./gradlew :compile:desktopTest :compile:testAndroidHostTest :shape-preview:desktopTest :shape-preview:testAndroidHostTest :ui:desktopTest :ui:testAndroidHostTest :app-android:testDebugUnitTest :app-desktop:test
      # The core job's spotlessCheck runs with -Ptypewright.android=false, so it never lints the
      # Android-bearing modules (app-android, and every module's androidMain). This is the only
      # job with the Android SDK on PATH, so it is the one whole-project ktlint check.
      - name: ktlint, whole project
        run: ./gradlew spotlessCheck
      # Uploads run last, after the build above and the tests/lint above it: a step with no
      # `if: always()` never runs once an earlier step in the job has failed, so nothing here
      # uploads a build from a job whose own tests didn't pass.
      - name: Upload debug APK (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: app-android-debug-apk
          path: app-android/build/outputs/apk/debug/*.apk
          retention-days: 7
      # Compose writes the packaged app to app-desktop/build/compose/binaries/main/app/ (confirmed
      # by running this task locally); tarring it is cheaper than a second upload-artifact zip step
      # and keeps file permissions (the launcher script) intact.
      - name: Linux desktop distributable (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          ./gradlew :app-desktop:createDistributable
          tar -czf app-desktop-linux.tar.gz -C app-desktop/build/compose/binaries/main app
      - name: Upload Linux desktop distributable (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: app-desktop-linux
          path: app-desktop-linux.tar.gz
          retention-days: 7

  golden-path:
    name: golden-path (acceptance harness; pass count never blocks, ratchet does)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
        with:
          # The MIT-licensed cache; the default "enhanced" cache is a proprietary component.
          cache-provider: basic
      - name: Android SDK packages the build needs
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null
      # goldenPath prints the pass count and never fails on step results; goldenPathRatchet fails
      # the build the moment a step listed in golden-path/passing-steps.txt stops passing, or a
      # passing step goes unlisted (see that file's own header, and golden-path/README.md).
      - name: Golden path pass count and ratchet
        run: ./gradlew :golden-path:goldenPath :golden-path:goldenPathRatchet
      - name: Golden path summary
        if: always()
        run: cat golden-path/build/golden-path/summary.txt >> "$GITHUB_STEP_SUMMARY"

  web:
    name: web (Wasm distribution, Wasm tests under Node)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
        with:
          # The MIT-licensed cache; the default "enhanced" cache is a proprietary component.
          cache-provider: basic
      - name: Production browser distribution (Binaryen downloaded from its GitHub releases)
        run: ./gradlew :app-web:wasmJsBrowserDistribution
      - name: Wasm tests (pure and compile/shape-preview under Node; app-web, shape-preview and ui in headless Chrome)
        run: ./gradlew wasmJsNodeTest :app-web:wasmJsBrowserTest :shape-preview:wasmJsBrowserTest :ui:wasmJsBrowserTest
      # Runs last, after the Wasm tests above: a step with no `if: always()` never runs once an
      # earlier step in the job has failed, so this never uploads a bundle from a job whose own
      # tests didn't pass.
      - name: Upload web production bundle (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: app-web-production
          path: app-web/build/dist/wasmJs/productionExecutable/
          retention-days: 7
