# The one place the app's version is written. Read by app-android (versionName, versionCode),
# app-desktop (the package version) and tools/sync_version.py, which writes the constant the
# About screen shows. Change it here, run `python3 tools/sync_version.py`, and nothing else.
#
# VERSION_NAME is SemVer with an optional -rcN suffix. VERSION_CODE is Android's integer and must
# rise with every build uploaded to a store, so raise it by hand for each upload.
VERSION_NAME=1.0.0-rc1
VERSION_CODE=1
